name: WebUI Tests

on:
  pull_request:
    paths:
      - 'webui/**'
  push:
    branches: [main]
    paths:
      - 'webui/**'

permissions:
  contents: read

jobs:
  test-webui:
    runs-on: ubuntu-latest
    # Normal runs take ~6 min; cap well below GitHub's 6h default so a stalled
    # apt mirror or hung step fails instead of running for hours.
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json
      
      - name: Install dependencies
        working-directory: webui
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webui/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: webui
        timeout-minutes: 10
        run: npm run test:install

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: webui
        timeout-minutes: 10
        run: npx playwright install-deps chromium firefox
      
      - name: Build application
        working-directory: webui
        run: npm run build
      
      - name: Run tests
        working-directory: webui
        run: npm test
        
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: webui/playwright-report/
          retention-days: 30
