name: Validate data
on:
  pull_request:
    paths:
      - 'data/**'
      - 'stores/**'
      - 'schemas/**'
      - 'ofd/**'
      - 'requirements.txt'
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'stores/**'
      - 'schemas/**'
      - 'ofd/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  validate_data:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        name: [ json-files, folder-names, store-ids, logo-files ]
    name: Validate data - ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history for PR change detection
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate data
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: only validate changed files (20-50x faster)
            python -m ofd validate --${{ matrix.name }} --changed-only --base-branch origin/${{ github.base_ref }}
          else
            # Push to main or manual trigger: full validation
            python -m ofd validate --${{ matrix.name }}
          fi
